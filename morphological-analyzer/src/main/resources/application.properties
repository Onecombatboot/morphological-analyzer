spring.application.name=morphological-analyzer

# ---------------------------------------------------------------------------
# Model locations. These are resolved against the working directory the app is
# started from, so keep the "models" folder beside the jar (or beside pom.xml
# when running from source). Override with --gma.nli.model-dir=... if needed.
# ---------------------------------------------------------------------------
gma.nli.model-dir=models/nli-deberta-v3-large
gma.embedding.model-dir=models/all-MiniLM-L6-v2

# Contradiction probability at or above which a pair is marked X in the grid.
# Raise it to mark fewer pairs, lower it to mark more.
gma.nli.contradiction-threshold=0.70

# Leave blank to use this machine's temp directory for DJL's native libraries.
gma.nli.temp-dir=

# ---------------------------------------------------------------------------
# Analyst overrides. Standing rulings on value pairs, kept in a plain JSON file
# beside the jar. These outrank both the model and the calibration head, and
# they survive a re-run, so a judgement recorded once holds from then on.
#
# The file is readable and editable by hand. Open it if you need to show a
# reviewer why a particular combination was eliminated.
#
# Set gma.overrides.enabled=false to ignore every recorded ruling for one run
# without deleting the file (useful for seeing what the model does unaided).
# ---------------------------------------------------------------------------
gma.overrides.file=data/overrides.json
gma.overrides.enabled=true

# ---------------------------------------------------------------------------
# Calibration head. A nine-parameter logistic regression fitted on the recorded
# rulings, sitting on top of the two frozen models. It learns how far to trust
# the contradiction score in this domain; it cannot learn domain facts, which
# is what the overrides above are for.
#
# It is only used once it has been trained from the interface. Until then, and
# whenever gma.calibration.enabled=false, pairs are decided by the raw NLI
# threshold exactly as before.
#
# Note: an active head doubles CCA time, because it reads both NLI directions.
# ---------------------------------------------------------------------------
gma.calibration.file=data/calibration.json
gma.calibration.enabled=true

# ---------------------------------------------------------------------------
# Cross-consistency engine: a local instruction-tuned model, run through
# llama.cpp on CPU. It replaces the NLI model, which measured AUC 0.53 against
# expert labels -- that is, it ranked pairs no better than a coin toss.
#
# The model is asked once per PARAMETER PAIR, with every value of both
# parameters visible at once, not once per cell. Judging cells in isolation is
# what allowed the same concept to get opposite verdicts on trivial wording
# differences, and it cost 176 generations instead of 6.
#
# gma.llm.threads=0 lets llama.cpp choose; pinned to 8 (physical cores) here. Note that fixing it is what makes
# results byte-reproducible: changing the thread count changes the order of
# floating-point reductions and can therefore flip a verdict.
# ---------------------------------------------------------------------------
gma.llm.enabled=true
gma.llm.model=models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
# Small on purpose: prompts run 250-450 tokens and answers under 60, so a bigger
# context only costs KV-cache allocation and slows every call down.
gma.llm.ctx-size=2048
gma.llm.threads=8
# Qwen3.5 deliberates by default. On CPU that is hundreds of extra tokens for a
# sixteen-cell answer; letting the model reason freely was measured at 515s for
# one matrix against 45s. The assistant turn is prefilled with an empty think
# block, which is the model's own documented way of skipping it.
gma.llm.suppress-thinking=true

# What counts as "inconsistent". This is the single most influential line in
# the prompt and it is a judgement call, not a fact: in Ritchey's method a pair
# is excluded when it is implausible enough not to be worth carrying forward,
# which is a much lower bar than impossibility. Wording it as "only the truly
# impossible" halved the number of pairs excluded on a labelled matrix.
# Leave blank to use the default compiled into LlmCcaService.
gma.llm.criterion=

# The NLI model is no longer in the decision path and is NOT shipped in the
# offline package -- it measured AUC 0.53 against expert labels, meaning it
# ranked pairs no better than a coin toss. Set gma.nli.enabled=true only if you
# restore models/nli-deberta-v3-large and want /api/debug/pair back.
# The threshold above 1.0 means it can never mark anything even if re-enabled.
gma.nli.enabled=false
gma.nli.contradiction-threshold=1.01

# ---------------------------------------------------------------------------
# Fine-tuned cross-consistency model (Qwen2.5-3B + LoRA), served over local HTTP
# by training/serve_cca.py. It is a PEFT adapter in HuggingFace format, not a
# GGUF, so it cannot go in gma.llm.model above -- see FineTunedCcaService.
#
# Start it first:
#   cd training && python serve_cca.py --adapter results/cell_drop7 --port 8000
#
# Endpoints it backs:  POST /api/matrix/cca-model   POST /api/matrix/cca-score
# Unlike /api/matrix/full-analysis, these need each value's REQUIRES/PROVIDES.
# ---------------------------------------------------------------------------
gma.cca.enabled=true
gma.cca.url=http://127.0.0.1:8000
gma.cca.timeout-seconds=1800

# Which engine decides each pair in /api/matrix/full-analysis:
#   finetuned = the QLoRA model trained on the cross-consistency corpus (default)
#   llm       = the Qwen2.5-7B GGUF baseline
# With 'finetuned', the app falls back to the GGUF engine automatically if the
# scoring service is not reachable, so the grid is never lost.
# "llm" drives the interface's full-analysis flow through llama.cpp.
#
# It is NOT "finetuned" any more. That setting made the request go to
# serve_cca.py over HTTP, and there is no longer a Python service to answer it;
# with nothing listening the call fails and the result falls back silently.
#
# The fine-tuned model has not gone anywhere -- it runs in process now, and is
# reached through /api/matrix/cca-score and /api/matrix/cca-model. Those
# endpoints require each value's REQUIRES and PROVIDES, which the interface
# does not currently collect, which is exactly why the interface uses llama.cpp
# and the fine-tuned model is driven by API.
gma.cca.engine=llm

# ---------------------------------------------------------------------------
# Fine-tuned cross-consistency model, in process (ONNX Runtime, CPU).
#
# This is the model the project produced: a rank-32 QLoRA adapter on
# Qwen2.5-3B, merged, exported to ONNX and quantised to 4-bit block-wise. It
# replaces serve_cca.py -- same model, same prompt, same arithmetic, no Python
# and no second process.
#
# The output projection has been trimmed to the two verdict tokens and the
# final position, which is exact: the two logits that survive are the ones the
# untrimmed graph produced. It removes a 350x2048x151936 matmul and a 200 MB
# tensor per call.
#
# Scoring averages BOTH presentation orders. Do not turn that off to go faster.
# Measured on the held-out set, single-order scoring collapses the
# selective-prediction curve to F1 0.000 at 50% coverage -- the confidence
# signal inverts.
#
# threads: 0 lets ONNX Runtime choose. Pin it to the PHYSICAL core count.
# ---------------------------------------------------------------------------
gma.onnxcca.enabled=true
gma.onnxcca.model-dir=models/cca-int4
gma.onnxcca.threshold=0.5
gma.onnxcca.threads=8
